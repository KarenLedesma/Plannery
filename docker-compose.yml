version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plannery_user
      POSTGRES_PASSWORD: plannery_pass
      POSTGRES_DB: plannery_db
    ports:
      - "5432:5432"
    volumes:
      - plannery_pgdata:/var/lib/postgresql/data

volumes:
  plannery_pgdata: